<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Drew Johnston</title>
    <meta name="description" content="The personal homepage of Drew Johnston.">
    <meta name="author" content="Drew Johnston">
    <meta name="theme-color" content="#faf9f5">

    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="css/home.css">

    <script src="https://cdn.usefathom.com/script.js" data-site="JAWOZEQL" defer></script>
</head>

<body>
    <main class="page-shell">
        <section class="intro" aria-labelledby="page-title">
            <div class="portrait-frame">
                <img class="portrait" src="img/avatar.jpg" width="460" height="460"
                    alt="Drew Johnston smiling outdoors">
            </div>

            <div class="intro-copy">
                <p class="eyebrow">Hello, I&rsquo;m</p>
                <h1 id="page-title">Drew Johnston<span aria-hidden="true">.</span></h1>
                <p class="lede">I build useful software and run a couple of small companies.</p>

                <nav class="social-links" aria-label="Find Drew online">
                    <a href="https://github.com/drewjoh">GitHub</a>
                    <a href="https://www.linkedin.com/in/drewjoh/">LinkedIn</a>
                </nav>
            </div>
        </section>

        <section class="companies" aria-labelledby="companies-title">
            <p class="eyebrow" id="companies-title">My companies</p>

            <div class="company-list">
                <a class="company" href="https://tinybit.farm">
                    <span class="company-number" aria-hidden="true">01</span>
                    <span class="company-name">Tiny Bit Farm</span>
                    <span class="company-domain">tinybit.farm</span>
                    <span class="company-arrow" aria-hidden="true">&#8599;</span>
                </a>

                <a class="company" href="https://church.company">
                    <span class="company-number" aria-hidden="true">02</span>
                    <span class="company-name">The Church Company</span>
                    <span class="company-domain">church.company</span>
                    <span class="company-arrow" aria-hidden="true">&#8599;</span>
                </a>
            </div>
        </section>
    </main>
</body>

</html>
